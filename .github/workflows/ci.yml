name: CI

on:
  pull_request:
    branches: [main, next]
  push:
    branches: [main, next]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build validation image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: steamcmd-vitamined-final
          tags: steamcmd-vitamined:ci-${{ github.sha }}
          load: true
          provenance: false
          cache-from: type=gha,scope=steamcmd-vitamined
          cache-to: type=gha,scope=steamcmd-vitamined,mode=max

      - name: Run shared validation gate
        env:
          IMAGE_REF: steamcmd-vitamined:ci-${{ github.sha }}
        run: ./release.sh check --skip-build
