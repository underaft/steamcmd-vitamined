name: Publish image

on:
  push:
    branches: [next]
    tags: ['*.*.*']
  workflow_call:
    inputs:
      image_tag:
        description: Plain semver tag supplied by the manual release workflow.
        required: false
        type: string
      skip_validation:
        description: Skip the reusable validation job when it already ran upstream.
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  packages: write

jobs:
  validate:
    if: ${{ !inputs.skip_validation }}
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    if: ${{ always() && (inputs.skip_validation || needs.validate.result == 'success') }}
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve image tags
        id: tags
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/underaft/steamcmd-vitamined"

          if [[ -n "${INPUT_TAG}" ]]; then
            [[ "${INPUT_TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            tags="${image}:${INPUT_TAG}"
          elif [[ "${EVENT_REF}" == refs/heads/next ]]; then
            tags="${image}:latest"
          elif [[ "${EVENT_REF}" == refs/tags/* ]]; then
            version="${EVENT_REF#refs/tags/}"
            [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            git fetch origin main:refs/remotes/origin/main
            git merge-base --is-ancestor "${EVENT_SHA}" refs/remotes/origin/main
            tags="${image}:${version}"
          else
            echo "publish workflow received an unsupported ref: ${EVENT_REF}" >&2
            exit 1
          fi

          printf 'tags=%s\n' "${tags}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: steamcmd-vitamined-final
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: org.opencontainers.image.source=https://github.com/underaft/steamcmd-vitamined
          cache-from: type=gha,scope=steamcmd-vitamined
          cache-to: type=gha,scope=steamcmd-vitamined,mode=max
